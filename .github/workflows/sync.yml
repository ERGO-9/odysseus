name: Sync Fork

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 3:00 AM UTC
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh repo sync $GITHUB_REPOSITORY -b dev
